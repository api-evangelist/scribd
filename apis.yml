aid: scribd
name: Scribd
description: >-
  Scribd Inc. is an American digital-content media company founded in 2007 by
  Trip Adler, Jared Friedman and Tikhon Bernstam and headquartered in San
  Francisco, California. It operates four consumer platforms: Scribd (a
  document-sharing library), Everand (a subscription service for ebooks,
  audiobooks, magazines, podcasts and sheet music, formerly the flagship Scribd
  subscription), SlideShare (presentation hosting) and Fable (a social reading
  app). Scribd was an early Y Combinator company. Its historical public
  "Platform" API for uploading, converting and displaying documents is now
  legacy — the official Ruby client (scribd/rscribd) was archived in 2019,
  Scribd no longer accepts new API accounts, and the SlideShare developer portal
  has been retired — so this profile documents the company's identity and the
  remaining first-party developer artifacts rather than a live API surface.
